<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#10161d" />
    <title>五胡乱華 天下統一録</title>
  </head>
  <body>
    <div id="app">
      <canvas id="map" aria-label="中国北部の3Dマップ"></canvas>
      <div id="labels"></div>
      <header class="title">
        <h1>五胡乱華<small>天下統一録</small></h1>
        <p class="scenario"></p>
      </header>
      <div id="clock">
        <span id="clock-date"></span>
        <button id="clock-speed" type="button" aria-label="時間の進む速さ"></button>
      </div>
      <div id="event" hidden>
        <p id="event-text"></p>
        <button id="event-open" type="button">会戦準備へ</button>
        <button id="event-close" type="button">閉じる</button>
      </div>
      <p id="hint"></p>
      <button id="credits-open" type="button">出典</button>
      <button id="territory-toggle" type="button" aria-pressed="true">領土</button>
      <section id="info" hidden>
        <div class="info-inner">
          <div class="info-head">
            <h2 class="info-name"></h2>
            <span class="info-reading"></span>
          </div>
          <div class="info-owner">
            <span class="info-label">所属</span>
            <span class="info-chip"></span>
            <span class="info-faction"></span>
            <span class="info-detail"></span>
          </div>
          <dl class="info-stats">
            <div><dt>規模</dt><dd class="info-level"></dd></div>
            <div><dt>人口</dt><dd class="info-population"></dd></div>
            <div><dt>城防御</dt><dd class="info-defense"></dd></div>
          </dl>
          <p class="info-description"></p>
          <div class="info-zoom" role="group" aria-label="表示する距離">
            <button type="button" data-distance="95">広域</button>
            <button type="button" data-distance="30">中距離</button>
            <button type="button" data-distance="8">近距離</button>
          </div>
          <button class="info-close" type="button" aria-label="閉じる">×</button>
        </div>
      </section>
      <section id="army" hidden>
        <div class="army-inner">
          <div class="army-head">
            <h2 class="army-title"></h2>
            <span class="army-badge"></span>
            <span class="army-owner"><span class="army-chip"></span><span class="army-faction"></span></span>
            <span class="army-commander"></span>
            <span class="army-location"></span>
          </div>
          <dl class="army-stats">
            <div><dt>総兵力</dt><dd class="army-total"></dd></div>
            <div><dt>歩兵</dt><dd class="army-infantry"></dd></div>
            <div><dt>騎兵</dt><dd class="army-cavalry"></dd></div>
            <div><dt>弓兵</dt><dd class="army-archer"></dd></div>
            <div><dt>その他</dt><dd>0</dd></div>
          </dl>
          <dl class="army-stats">
            <div><dt>士気</dt><dd class="army-meter army-morale"><span><i></i></span><b></b></dd></div>
            <div><dt>疲労</dt><dd class="army-meter army-fatigue"><span><i></i></span><b></b></dd></div>
            <div><dt>食糧</dt><dd class="army-food"></dd></div>
            <div><dt>行軍速度</dt><dd class="army-speed"></dd></div>
            <div><dt>補給</dt><dd class="army-supply"></dd></div>
          </dl>
          <div class="army-actions">
            <p class="army-message"></p>
            <button class="army-battle" type="button" hidden>会戦準備</button>
            <button class="army-move" type="button">移動</button>
            <button class="army-halt" type="button" hidden>停止して野営</button>
            <button class="army-confirm" type="button" hidden>確定</button>
            <button class="army-cancel" type="button" hidden>キャンセル</button>
          </div>
          <button class="army-close" type="button" aria-label="閉じる">×</button>
        </div>
      </section>
      <section id="battle" hidden>
        <header class="battle-head">
          <span class="battle-type"></span>
          <h2 class="battle-name"></h2>
          <p class="battle-meta"></p>
        </header>
        <div class="battle-side attacker">
          <p class="battle-role">攻撃側</p>
          <div class="battle-side-body"></div>
        </div>
        <div class="battle-view">
          <div class="battle-detail" hidden>
            <div class="battle-rows"></div>
            <ul class="battle-notes"></ul>
            <p class="battle-caution">優劣は目安です。勝敗は指揮と戦場の流れで決まります。</p>
          </div>
        </div>
        <div class="battle-side defender">
          <p class="battle-role">防御側</p>
          <div class="battle-side-body"></div>
        </div>
        <footer class="battle-actions">
          <button class="battle-back" type="button">戦略マップに戻る</button>
          <button class="battle-info" type="button" aria-pressed="false">両軍情報</button>
          <button class="battle-start" type="button">戦闘開始</button>
        </footer>
        <div class="battle-handoff" hidden>
          <div class="battle-handoff-inner">
            <h3>会戦の準備が整いました</h3>
            <p>3D戦闘は次の段階で実装します。次の内容を戦闘画面へ引き継ぎます。</p>
            <ul class="battle-handoff-list"></ul>
            <button class="battle-handoff-back" type="button">戦略マップに戻る(戦闘は保留)</button>
          </div>
        </div>
      </section>
      <section id="battle-hud" hidden>
        <header class="hud-top">
          <div class="hud-strength attacker">
            <span class="hud-side-name attacker"></span>
            <span class="hud-men attacker"></span>
            <span class="hud-strength-bar"><i></i></span>
          </div>
          <div class="hud-center">
            <span class="hud-name"></span>
            <span class="hud-time"></span>
            <button class="hud-pause" type="button"></button>
            <button class="hud-speed" type="button"></button>
          </div>
          <div class="hud-strength defender">
            <span class="hud-side-name defender"></span>
            <span class="hud-men defender"></span>
            <span class="hud-strength-bar"><i></i></span>
          </div>
        </header>
        <div class="hud-list attacker" aria-label="自軍の部隊"></div>
        <div class="hud-list defender" aria-label="敵軍の部隊"></div>
        <footer class="hud-bottom">
          <p class="hud-tip">自軍の部隊をタップして選び、地面をタップで移動、敵をタップで攻撃</p>
          <div class="hud-unit" hidden>
            <div class="hud-unit-info">
              <strong class="hud-unit-name"></strong>
              <span class="hud-unit-class"></span>
              <span class="hud-unit-state"></span>
              <span class="hud-unit-commander"></span>
            </div>
            <dl class="hud-unit-stats">
              <div><dt>兵力</dt><dd class="hud-unit-men"></dd></div>
              <div><dt>士気</dt><dd class="hud-meter hud-unit-morale"><span><i></i></span><b></b></dd></div>
              <div><dt>疲労</dt><dd class="hud-meter hud-unit-fatigue"><span><i></i></span><b></b></dd></div>
            </dl>
            <div class="hud-orders">
              <button class="hud-order hud-hold" type="button">待機</button>
              <button class="hud-order hud-pursue" type="button" aria-pressed="false">追撃</button>
              <button class="hud-order hud-retreat" type="button">撤退</button>
            </div>
          </div>
          <div class="hud-tools">
            <button class="hud-rotate-left" type="button" aria-label="左に回す">⟲</button>
            <button class="hud-rotate-right" type="button" aria-label="右に回す">⟳</button>
            <button class="hud-overview" type="button">全景</button>
            <button class="hud-follow" type="button" aria-pressed="false">追従</button>
            <button class="hud-advance-all" type="button">全軍前進</button>
            <button class="hud-retreat-all" type="button">全軍撤退</button>
          </div>
        </footer>
        <div class="hud-confirm" hidden>
          <p>全軍を撤退させますか? 背を向けて退くので、追撃で損害が出ます。</p>
          <button class="hud-confirm-yes" type="button">撤退する</button>
          <button class="hud-confirm-no" type="button">戦いを続ける</button>
        </div>
        <div class="hud-result" hidden>
          <div class="hud-result-inner">
            <h2 class="hud-result-title"></h2>
            <p class="hud-result-summary"></p>
            <div class="hud-result-table"></div>
            <button class="hud-leave" type="button">戦略マップへ戻る</button>
          </div>
        </div>
      </section>
      <section id="credits" hidden>
        <div class="credits-inner">
          <h2>データの出典</h2>
          <div class="credits-list"></div>
          <button id="credits-close" type="button">閉じる</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
