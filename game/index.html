<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#10161d" />
    <title>五胡乱華 天下統一録</title>
  </head>
  <body>
    <div id="app">
      <canvas id="map" aria-label="中国北部の3Dマップ"></canvas>
      <div id="labels"></div>
      <header class="title">
        <h1>五胡乱華<small>天下統一録</small></h1>
        <p class="scenario"></p>
      </header>
      <div id="clock">
        <span id="clock-date"></span>
        <button id="clock-speed" type="button" aria-label="時間の進む速さ"></button>
      </div>
      <div id="event" hidden>
        <p id="event-text"></p>
        <button id="event-close" type="button">閉じる</button>
      </div>
      <p id="hint"></p>
      <button id="credits-open" type="button">出典</button>
      <section id="info" hidden>
        <div class="info-inner">
          <div class="info-head">
            <h2 class="info-name"></h2>
            <span class="info-reading"></span>
          </div>
          <div class="info-owner">
            <span class="info-label">所属</span>
            <span class="info-chip"></span>
            <span class="info-faction"></span>
            <span class="info-detail"></span>
          </div>
          <dl class="info-stats">
            <div><dt>規模</dt><dd class="info-level"></dd></div>
            <div><dt>人口</dt><dd class="info-population"></dd></div>
            <div><dt>城防御</dt><dd class="info-defense"></dd></div>
          </dl>
          <p class="info-description"></p>
          <div class="info-zoom" role="group" aria-label="表示する距離">
            <button type="button" data-distance="95">広域</button>
            <button type="button" data-distance="30">中距離</button>
            <button type="button" data-distance="8">近距離</button>
          </div>
          <button class="info-close" type="button" aria-label="閉じる">×</button>
        </div>
      </section>
      <section id="army" hidden>
        <div class="army-inner">
          <div class="army-head">
            <h2 class="army-title"></h2>
            <span class="army-badge"></span>
            <span class="army-owner"><span class="army-chip"></span><span class="army-faction"></span></span>
            <span class="army-commander"></span>
            <span class="army-location"></span>
          </div>
          <dl class="army-stats">
            <div><dt>総兵力</dt><dd class="army-total"></dd></div>
            <div><dt>歩兵</dt><dd class="army-infantry"></dd></div>
            <div><dt>騎兵</dt><dd class="army-cavalry"></dd></div>
            <div><dt>弓兵</dt><dd class="army-archer"></dd></div>
            <div><dt>その他</dt><dd>0</dd></div>
          </dl>
          <dl class="army-stats">
            <div><dt>士気</dt><dd class="army-meter army-morale"><span><i></i></span><b></b></dd></div>
            <div><dt>疲労</dt><dd class="army-meter army-fatigue"><span><i></i></span><b></b></dd></div>
            <div><dt>食糧</dt><dd class="army-food"></dd></div>
            <div><dt>行軍速度</dt><dd class="army-speed"></dd></div>
            <div><dt>補給</dt><dd class="army-supply"></dd></div>
          </dl>
          <div class="army-actions">
            <p class="army-message"></p>
            <button class="army-move" type="button">移動</button>
            <button class="army-halt" type="button" hidden>停止して野営</button>
            <button class="army-confirm" type="button" hidden>確定</button>
            <button class="army-cancel" type="button" hidden>キャンセル</button>
          </div>
          <button class="army-close" type="button" aria-label="閉じる">×</button>
        </div>
      </section>
      <section id="credits" hidden>
        <div class="credits-inner">
          <h2>データの出典</h2>
          <div class="credits-list"></div>
          <button id="credits-close" type="button">閉じる</button>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
